<div [class]="'screen ' + bgClass()">
  <div class="content">

    <mn-title label="Settings" />

    <div class="setting-row">
      <span class="setting-pill">Sound</span>
      <button
        class="icon-btn"
        [class.on]="storage.soundEnabled()"
        (click)="toggleSound()">
        ♪
      </button>
    </div>

    <div class="setting-row">
      <span class="setting-pill">Background</span>
      <button
        class="icon-btn"
        [class.on]="storage.backgroundOn()"
        (click)="toggleBackground()">
        ✓
      </button>
    </div>

    <div class="setting-row">
      <span class="setting-pill">Reset</span>
      <button class="icon-btn reset-btn" (click)="reset()">↺</button>
    </div>

    <div class="setting-row">
      <span class="setting-pill">Layout</span>
    </div>
    <div class="theme-picker">
      <button class="theme-chip" [class.on]="storage.theme() === 'classic'"   (click)="setTheme('classic')">Classic</button>
      <button class="theme-chip" [class.on]="storage.theme() === 'synthwave'" (click)="setTheme('synthwave')">Synth</button>
      <button class="theme-chip" [class.on]="storage.theme() === 'modern'"   (click)="setTheme('modern')">Modern</button>
    </div>

    <div class="spacer"></div>

    <p class="version">v{{ version }}</p>
    <mn-button label="Home" (press)="back()" />

  </div>

  @if (showResetConfirm()) {
    <div class="overlay">
      <div class="overlay-card">
        <div class="overlay-icon">⚠️</div>
        <h2>Reset Progress?</h2>
        <p class="overlay-sub">Level resets to 1. Your nickname and high score are kept.</p>
        <mn-button label="Reset"  [style.--mn-btn-bg]="resetBg" (press)="confirmReset()" />
        <mn-button label="Cancel" (press)="cancelReset()" />
      </div>
    </div>
  }

</div>
