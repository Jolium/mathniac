<div [class]="'screen ' + bgClass()">
  <div class="content">

    <div class="page-title">Settings</div>

    <div class="setting-row">
      <span class="setting-pill">Sound</span>
      <button
        class="icon-btn"
        [class.on]="storage.soundEnabled()"
        (click)="toggleSound()">
        {{ storage.soundEnabled() ? '🔊' : '🔇' }}
      </button>
    </div>

    <div class="setting-row">
      <span class="setting-pill">Background</span>
      <button
        class="icon-btn"
        [class.on]="storage.backgroundOn()"
        (click)="toggleBackground()">
        {{ storage.backgroundOn() ? '✓' : '✕' }}
      </button>
    </div>

    <div class="setting-row">
      <span class="setting-pill">Reset</span>
      <button class="icon-btn reset-btn" (click)="reset()">🔄</button>
    </div>

    <div class="spacer"></div>

    <p class="version">v{{ version }}</p>
    <button class="mn-btn" (click)="back()">Home</button>

  </div>
</div>
