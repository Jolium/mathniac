<div [class]="'screen ' + bgClass()">
  <div class="content">

    <mn-title label="Mathniac" />

    <div class="btn-group">
      <mn-button label="Intro"    (press)="nav('/intro')" />
      <mn-button label="Levels"   (press)="nav('/levels')" />
      <mn-button label="Settings" (press)="nav('/settings')" />
      <mn-button label="Scores"   (press)="nav('/scores')" />
    </div>

    <div class="spacer"></div>

    <div class="level-pill">Level {{ level() }}</div>

    <div class="btn-group">
      <mn-button label="Play" (press)="play()" />
    </div>

  </div>
</div>
