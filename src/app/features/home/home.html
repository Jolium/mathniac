<div [class]="'screen ' + bgClass()">
  <div class="content">

    <div class="page-title home-title">Mathniac</div>

    <div class="nav-buttons">
      <button class="mn-btn" (click)="nav('/intro')">Introduction</button>
      <button class="mn-btn" (click)="nav('/levels')">Level selection</button>
      <button class="mn-btn" (click)="nav('/scores')">High scores</button>
      <button class="mn-btn" (click)="nav('/settings')">Settings</button>
    </div>

    <div class="spacer"></div>

    <button
      class="mn-btn level-up-btn"
      [disabled]="level() >= 15"
      (click)="levelUp()">
      Level Up
    </button>

    <div class="level-pill">
      Level {{ level() }}
    </div>

    <button class="mn-btn play-btn" (click)="play()">Play</button>

  </div>
</div>
